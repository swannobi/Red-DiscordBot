name: block commits touching certain files
on: 
  push:
    branches:
      - 'test-workflow' # just for debugging this workflow in this repo
      - 'develop' # 'main' for RPL

jobs:
  check-commits:
    name: List files touched this commit
    runs-on: ubuntu-latest
    #runs-on: [ P-10BLD03-V ] #Ask someone in devops (or maybe Scott) if this is correct. Ripped from ORION22-R3/.github/workflows/Do Build.yml
    # one issue with the box above is that I think it runs Windows? Personally I'm much more comfortable with unix bash than Windows PowerShell,
    # so I wrote this in bash
    outputs:
      ref_before: ${{ steps.step1.outputs.ref_before }}
      ref_after: ${{ steps.step1.outputs.ref_after }}
      changed_files: ${{ steps.step2.outputs.changed_files }}
    steps:
      - id: step1
        name: Set before and after refs, including all commits within this push event
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "ref_before=$(echo $GITHUB_CONTEXT | jq -r '.event.before')" >> $GITHUB_OUTPUT
          echo "ref_after=$(echo $GITHUB_CONTEXT | jq -r '.event.after')" >> $GITHUB_OUTPUT
      - id: step2
        name: Store a list of all files touched in all commits involved in this push event
        run: |
          api_response="$(gh api /repos/swannobi/Red-DiscordBot/compare/${{ steps.step1.outputs.ref_before }}...${{ steps.step1.outputs.ref_after }} --jq .files[].filename)"
          echo "GitHub API reports changes to the following files: $api_response"
          
          # properly store multiline string into $GITHUB_OUTPUT
          echo 'changed_files<<EOF' >> $GITHUB_OUTPUT
          echo "$api_response" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
  check-files-against-blocklist:
    name: Check if any files are sensitive
    runs-on: ubuntu-latest
    needs: check-commits
    steps:
      - id: step1
        env:
          # Define a list of files to check for. We can store this in an environment config somewhere if necessary 
          # For example, we can use a existing Actions flow like https://github.com/marketplace/actions/simple-dotenv to load from a .env file
          # See also: https://docs.github.com/en/organizations/managing-organization-settings/managing-custom-properties-for-repositories-in-your-organization
          SENSITIVE_FILES: |
            notpresent.py
            main.yml
            doesntexist.py
          changed_files: ${{ needs.check-commits.outputs.changed_files }}
        run: |
          echo "inputs:"
          echo "changed_files = $changed_files"
          file_is_present=0
          declare -a changed_files_array
          declare -a sensitive_files_array

          while read -r line; do
            sensitive_files_array+=("$line")
          done < <(printf '%s' "$SENSITIVE_FILES") # use process substitution < <(...) instead of a here-string <<< to avoid extra newline
          
          while read -r line; do
            changed_files_array+=("$line")
          done < <(printf '%s' "$changed_files")

          echo "$changed_files_array"
          echo ""
          for changed in "${changed_files_array[@]}"; do
            for pci_file in "${sensitive_files_array[@]}"; do
              echo "DEBUG: ${pci_file} in ${changed}?"
              if [[ ${changed} =~ ${pci_file} ]]; then 
                file_is_present=1
                break
              fi
            done
            # short circuit to save a little compute time on the VM
            # alternatively, keep track of the list of sensitive files "mentioned" in these commits
            if [ $file_is_present -eq 1 ]; then break; fi;
          done
          if [ $file_is_present -eq 1 ]; then
            echo "do something based on one or more sensitive files being present in this push event!"
          else
            echo "do something (or nothing), there were no changes detected to any sensitive files"
          fi
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} #Required by the GitHub CLI
